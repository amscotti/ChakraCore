# Windows x86_64 Zig build CI (windows-latest + MSVC/WinSDK + vcpkg icu:x64-windows).
# Uses -DENABLE_OOP_NATIVE_CODEGEN=0 (no midl.exe) and -DDISABLE_JS_ETW (no mc.exe),
# leaving ml64.exe as the sole external MSVC binary required by zig build.
#
# What this workflow proves on every push/PR:
#   - preflight: Zig unit tests (tools/windows-gate-tests.zig, owned-bytes.zig,
#     u8a_codec.zig) + Python build/package tool unit tests & gate self-tests;
#   - zig (test): default native x86_64-windows-msvc build (`zig build`) +
#     check-build-tools, check-metadata (PE32+ & COFF .lib), verify-bytecode,
#     check-jit, check-gcstress, libChakraNodeApi (`161` PE32+ exports),
#     ch-nodeapi, check-nodeapi, check-smoke (`ch.exe` + `ch-nodeapi.exe`),
#     and check-package;
#   - zig-variants: parameterized Windows build matrix (-Djit=false,
#     -Dprofile=release-shared, -Dprofile=debug-static);
#   - record: assembles per-leg tallies and inputs into windows-evidence.

name: zig-windows (x86_64 Windows build + check + Node-API + package)

on:
  push:
    branches: [master, 'modernize/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    name: preflight (windows-gate-tests + build/package tools)
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      tally: ${{ steps.tally.outputs.tally }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v5
      - &mise
        name: Setup mise (Zig 0.17.0 from mise.toml)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - &assert-zig
        name: Assert Zig 0.17.0 and export zig to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zigVerOut = & mise exec -- zig version
          if ($LASTEXITCODE -ne 0) { throw "mise exec -- zig version failed ($LASTEXITCODE)" }
          $zigVer = (($zigVerOut | ForEach-Object { "$_" }) -join "`n").Trim()
          if ($zigVer -ne '0.17.0') { throw "Expected Zig 0.17.0, got '$zigVer'" }
          $zigBinOut = & mise which zig
          if ($LASTEXITCODE -ne 0) { throw "mise which zig failed ($LASTEXITCODE)" }
          $zigBin = (($zigBinOut | ForEach-Object { "$_" }) -join "`n").Trim()
          (Split-Path -Parent $zigBin) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Using zig $zigVer at $zigBin"
      - name: Run Zig gate/unit tests and Python tool suites
        id: tally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-evidence | Out-Null
          function Invoke-Logged {
            param([string]$Log, [string]$Exe, [string[]]$CmdArgs)
            Write-Host "=== $Exe $($CmdArgs -join ' ') ==="
            $prevPref = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
              $PSNativeCommandUseErrorActionPreference = $false
            }
            try {
              & $Exe @CmdArgs 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $Log -Append
              $rc = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $prevPref
            }
            if ($rc -ne 0) { throw "Command failed ($rc): $Exe $($CmdArgs -join ' ')" }
          }
          Invoke-Logged "ci-evidence/preflight.log" "zig" @("test", "tools/windows-gate-tests.zig")
          Invoke-Logged "ci-evidence/preflight.log" "zig" @("test", "doc/examples/owned-bytes.zig")
          Invoke-Logged "ci-evidence/preflight.log" "zig" @("test", "lib/ZigCodec/u8a_codec.zig")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/test_build_tools.py")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/package/test_package_tools.py")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_metadata_windows.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_smoke_windows.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_regression_windows.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_jit.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_fulljit.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_gcstress.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/check_nodeapi.py", "--self-test")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/build/gen_nodeapi_exports.py", "--check")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/test262/test_run.py")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/test262/test_edition_policy.py")
          Invoke-Logged "ci-evidence/preflight.log" "python" @("tools/test262/refresh_baseline.py", "--self-test")
          $line = "windows-preflight: gate-tests=PASS build-tools=PASS package-tools=PASS selftests=PASS"
          $line | Out-File -FilePath ci-evidence/tally.txt -Encoding utf8
          "tally=$line" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "- $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload windows-preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-preflight
          path: ci-evidence/

  zig:
    name: zig windows test (build + gates + Node-API + package)
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      tally: ${{ steps.tally.outputs.tally }}
    steps:
      - *checkout
      - *mise
      - *assert-zig
      - &msvc
        name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - &vcpkg-probe
        name: Resolve vcpkg root
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ilammy/msvc-dev-cmd runs VsDevCmd, which sets VCPKG_ROOT to Visual Studio's
          # manifest-only VC\vcpkg directory. Prefer VCPKG_INSTALLATION_ROOT (standalone
          # classic-mode runner install) and require both vcpkg.exe and ports/.
          $candidates = @(
            $env:VCPKG_INSTALLATION_ROOT
            $env:VCPKG_ROOT
            "C:\vcpkg"
          ) | Where-Object { $_ -and $_.Trim() -ne '' } | Select-Object -Unique
          $root = $null
          foreach ($cand in $candidates) {
            if ((Test-Path (Join-Path $cand "vcpkg.exe")) -and (Test-Path (Join-Path $cand "ports"))) {
              $root = $cand
              break
            }
          }
          if (-not $root) {
            foreach ($cand in $candidates) {
              if ((Test-Path (Join-Path $cand "vcpkg.exe")) -and ($cand -notmatch '[\\/]VC[\\/]vcpkg$')) {
                $root = $cand
                break
              }
            }
          }
          if (-not $root) {
            throw "Classic-mode vcpkg root (vcpkg.exe + ports/) not found. Probed: $($candidates -join ', ')"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $root | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "vcpkg_root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archives_dir=$(Join-Path $env:LOCALAPPDATA 'vcpkg\archives')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - &vcpkg-cache
        name: Cache vcpkg icu:x64-windows
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.vcpkg.outputs.vcpkg_root }}\installed\x64-windows
            ${{ steps.vcpkg.outputs.archives_dir }}
          key: windows-x64-vcpkg-icu-v1
          restore-keys: |
            windows-x64-vcpkg-icu-
      - &vcpkg-icu
        name: Install icu:x64-windows and expose ICU DLLs on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $icuDir = Join-Path $env:VCPKG_ROOT "installed\x64-windows"
          $icuInclude = Join-Path $icuDir "include"
          $icuLib = Join-Path $icuDir "lib"
          $icuBin = Join-Path $icuDir "bin"
          if (-not (Test-Path "$icuInclude\unicode\uchar.h") -or
              -not (Test-Path "$icuLib\icuuc.lib") -or
              -not (Test-Path "$icuLib\icuin.lib")) {
            $prevPref = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
              $PSNativeCommandUseErrorActionPreference = $false
            }
            $pushed = $false
            try {
              $workTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
              Push-Location $workTemp
              $pushed = $true
              & $vcpkgExe install icu:x64-windows --classic "--vcpkg-root=$env:VCPKG_ROOT"
              $rc = $LASTEXITCODE
            } finally {
              if ($pushed) { Pop-Location }
              $ErrorActionPreference = $prevPref
            }
            if ($rc -ne 0) { throw "vcpkg install icu:x64-windows failed ($rc)" }
          }
          if (-not (Test-Path "$icuInclude\unicode\uchar.h")) { throw "Missing $icuInclude\unicode\uchar.h" }
          if (-not (Test-Path "$icuLib\icuuc.lib")) { throw "Missing $icuLib\icuuc.lib" }
          if (-not (Test-Path "$icuLib\icuin.lib")) { throw "Missing $icuLib\icuin.lib" }
          if (-not (Get-ChildItem "$icuBin\icuuc*.dll" -ErrorAction SilentlyContinue)) {
            throw "Missing icuuc*.dll under $icuBin"
          }
          if (-not (Get-ChildItem "$icuBin\icuin*.dll" -ErrorAction SilentlyContinue)) {
            throw "Missing icuin*.dll under $icuBin"
          }
          "CHAKRA_ICU_DIR=$icuDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ICU_INCLUDE_DIR=$icuInclude" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ICU_LIB_DIR=$icuLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $icuBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - &record-inputs
        name: Record Windows inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-evidence | Out-Null
          zig version | Out-File -FilePath ci-evidence/zig-version.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "zig version failed ($LASTEXITCODE)" }
          zig env | Out-File -FilePath ci-evidence/zig-env.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "zig env failed ($LASTEXITCODE)" }
          @(
            "VCToolsInstallDir=$env:VCToolsInstallDir"
            "WindowsSdkDir=$env:WindowsSdkDir"
            "WindowsSDKVersion=$env:WindowsSDKVersion"
            "VCPKG_ROOT=$env:VCPKG_ROOT"
            "CHAKRA_ICU_DIR=$env:CHAKRA_ICU_DIR"
            "ICU_INCLUDE_DIR=$env:ICU_INCLUDE_DIR"
            "ICU_LIB_DIR=$env:ICU_LIB_DIR"
            "ml64=$((Get-Command ml64.exe).Source)"
            "python=$((Get-Command python).Source) ($(python --version 2>&1))"
          ) | Out-File -FilePath ci-evidence/inputs.txt -Encoding utf8
      - name: zig build check-build-tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          zig build @icuFlags check-build-tools 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath ci-evidence/check-build-tools.log
          if ($LASTEXITCODE -ne 0) { throw "zig build check-build-tools failed ($LASTEXITCODE)" }
      - name: zig build (default test profile)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          zig build @icuFlags 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath ci-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw "zig build failed ($LASTEXITCODE)" }
      - name: Core PE32+ metadata, bytecode, JIT, Wasm, regression, & GCStress gates (check-metadata, verify-bytecode, check-jit, check-gcstress, check-fulljit, check-wasm, check-regression)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          foreach ($step in @("check-metadata", "verify-bytecode", "check-jit", "check-gcstress", "check-fulljit", "check-wasm", "check-regression")) {
            Write-Host "=== zig build $step ==="
            $stepFlags = if ($step -eq "check-regression") { @("-Dallow-unpinned-regression=true") } else { @() }
            zig build @icuFlags @stepFlags $step 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "ci-evidence/$step.log"
            if ($LASTEXITCODE -ne 0) { throw "zig build $step failed ($LASTEXITCODE)" }
          }
      - name: Node-API stack, Windows smoke, & package gate (libChakraNodeApi, ch-nodeapi, check-nodeapi, check-smoke, check-package)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          foreach ($step in @("libChakraNodeApi", "ch-nodeapi", "check-nodeapi", "check-smoke", "check-package")) {
            Write-Host "=== zig build $step ==="
            zig build @icuFlags $step 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "ci-evidence/$step.log"
            if ($LASTEXITCODE -ne 0) { throw "zig build $step failed ($LASTEXITCODE)" }
          }
      - name: Tally gate outputs
        id: tally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path ci-evidence/check-jit.log -Pattern 'check_jit: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_jit: PASS' in ci-evidence/check-jit.log"
          }
          if (-not (Select-String -Path ci-evidence/check-gcstress.log -Pattern 'check_gcstress: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_gcstress: PASS' in ci-evidence/check-gcstress.log"
          }
          if (-not (Select-String -Path ci-evidence/check-nodeapi.log -Pattern 'check_nodeapi: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_nodeapi: PASS' in ci-evidence/check-nodeapi.log"
          }
          if (-not (Select-String -Path ci-evidence/check-package.log -Pattern 'VERIFY PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'VERIFY PASS' in ci-evidence/check-package.log"
          }
          if (-not (Select-String -Path ci-evidence/check-package.log -Pattern 'ALL PACKAGE TESTS PASSED SUCCESSFULLY!' -SimpleMatch -Quiet)) {
            throw "Missing 'ALL PACKAGE TESTS PASSED SUCCESSFULLY!' in ci-evidence/check-package.log"
          }
          if (-not (Select-String -Path ci-evidence/check-fulljit.log -Pattern 'check_fulljit: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_fulljit: PASS' in ci-evidence/check-fulljit.log"
          }
          if (-not (Select-String -Path ci-evidence/check-wasm.log -Pattern 'check_wasm_p1: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_wasm_p1: PASS' in ci-evidence/check-wasm.log"
          }
          if (-not (Select-String -Path ci-evidence/check-regression.log -Pattern 'check_regression_windows: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_regression_windows: PASS' in ci-evidence/check-regression.log"
          }
          $line = "windows-test: build=PASS smoke=PASS metadata=PASS bytecode=PASS jit=PASS fulljit=PASS wasm=PASS regression=PASS gcstress=PASS nodeapi=PASS package=PASS"
          $line | Out-File -FilePath ci-evidence/tally.txt -Encoding utf8
          "tally=$line" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "- $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload zig-windows-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zig-windows-test
          path: ci-evidence/

  zig-variants:
    name: zig windows ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nojit
            flags: "-Djit=false"
            checks: "check-smoke check-metadata verify-bytecode check-gcstress check-regression"
          - name: release-shared
            flags: "-Dprofile=release-shared"
            checks: "check-metadata check-jit check-gcstress libChakraNodeApi ch-nodeapi check-nodeapi check-smoke check-package"
          - name: debug-static
            flags: "-Dprofile=debug-static"
            checks: "check-smoke check-metadata verify-bytecode check-gcstress check-regression"
    outputs:
      tally: ${{ steps.tally.outputs.tally }}
    steps:
      - *checkout
      - *mise
      - *assert-zig
      - *msvc
      - *vcpkg-probe
      - *vcpkg-cache
      - *vcpkg-icu
      - *record-inputs
      - name: zig build ${{ matrix.flags }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $flagList = @('${{ matrix.flags }}' -split '\s+' | Where-Object { $_ })
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          zig build @flagList @icuFlags 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath ci-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw "zig build ${{ matrix.flags }} failed ($LASTEXITCODE)" }
      - name: Run variant checks (${{ matrix.checks }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $flagList = @('${{ matrix.flags }}' -split '\s+' | Where-Object { $_ })
          $icuFlags = @("-Dicu-include=$env:ICU_INCLUDE_DIR", "-Dicu-libdir=$env:ICU_LIB_DIR")
          $checkList = @('${{ matrix.checks }}' -split '\s+' | Where-Object { $_ })
          foreach ($step in $checkList) {
            Write-Host "=== zig build ${{ matrix.flags }} $step ==="
            $stepFlags = if ($step -eq "check-regression") { @("-Dallow-unpinned-regression=true") } else { @() }
            zig build @flagList @icuFlags @stepFlags $step 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath ci-evidence/checks.log -Append
            if ($LASTEXITCODE -ne 0) { throw "zig build ${{ matrix.flags }} $step failed ($LASTEXITCODE)" }
          }
      - name: Tally gate outputs
        id: tally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path ci-evidence/checks.log -Pattern 'check_gcstress: PASS' -SimpleMatch -Quiet)) {
            throw "Missing 'check_gcstress: PASS' in ci-evidence/checks.log"
          }
          if ('${{ matrix.name }}' -eq 'release-shared') {
            if (-not (Select-String -Path ci-evidence/checks.log -Pattern 'check_jit: PASS' -SimpleMatch -Quiet)) {
              throw "Missing 'check_jit: PASS' in ci-evidence/checks.log"
            }
            if (-not (Select-String -Path ci-evidence/checks.log -Pattern 'check_nodeapi: PASS' -SimpleMatch -Quiet)) {
              throw "Missing 'check_nodeapi: PASS' in ci-evidence/checks.log"
            }
            if (-not (Select-String -Path ci-evidence/checks.log -Pattern 'ALL PACKAGE TESTS PASSED SUCCESSFULLY!' -SimpleMatch -Quiet)) {
              throw "Missing 'ALL PACKAGE TESTS PASSED SUCCESSFULLY!' in ci-evidence/checks.log"
            }
          } else {
            if (-not (Select-String -Path ci-evidence/checks.log -Pattern 'check_regression_windows: PASS' -SimpleMatch -Quiet)) {
              throw "Missing 'check_regression_windows: PASS' in ci-evidence/checks.log"
            }
          }
          $line = "windows-${{ matrix.name }}: build=PASS checks=PASS"
          $line | Out-File -FilePath ci-evidence/tally.txt -Encoding utf8
          "tally=$line" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "- $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload zig-windows-${{ matrix.name }} evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zig-windows-${{ matrix.name }}
          path: ci-evidence/

  record:
    name: record (assemble Windows evidence bundle)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [preflight, zig, zig-variants]
    if: ${{ !cancelled() }}
    steps:
      - name: Download all leg evidence
        uses: actions/download-artifact@v6
        with:
          path: evidence-in
      - name: Assemble windows-evidence bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path windows-evidence/tallies | Out-Null
          $summary = @(
            "# Windows CI evidence bundle"
            ""
            "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            "ref: ${{ github.ref }} sha: ${{ github.sha }}"
            ""
            "## Tallies"
            ""
          )
          $dirs = if (Test-Path evidence-in) { Get-ChildItem -Path evidence-in -Directory | Sort-Object Name } else { @() }
          foreach ($d in $dirs) {
            $leg = $d.Name
            $summary += "### $leg"
            $tallyPath = Join-Path $d.FullName "tally.txt"
            if (Test-Path $tallyPath) {
              $raw = Get-Content $tallyPath -Raw
              $t = if ($null -ne $raw) { $raw.Trim() } else { "" }
              $summary += $t
              Copy-Item $tallyPath "windows-evidence/tallies/$leg.txt"
              "- $t" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              $summary += "(no tally.txt)"
            }
            $summary += ""
          }
          $summary | Out-File -FilePath windows-evidence/SUMMARY.md -Encoding utf8
          Get-Content windows-evidence/SUMMARY.md
      - name: Upload windows-evidence bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-evidence
          path: windows-evidence/
      - name: Fail if any upstream job failed or was cancelled
        if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        shell: pwsh
        run: |
          Write-Host "::error::One or more upstream jobs failed or was cancelled."
          exit 1
